{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход · {{ house_name }}</title>
  <link rel="icon" href="{% static 'booking/brand/logo-mark.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'booking/brand/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'booking/brand/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% url 'manifest' %}">
  <meta name="theme-color" content="#1f2b3a">
  <link rel="preload" href="{% static 'booking/fonts/unbounded-cyrillic-600-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'booking/style.css' %}">
</head>
<body>
<div class="login-page"{% if winter %} data-snow{% endif %}>
  {% if cover_url %}
    <div class="login-bg" style="background-image: url('{{ cover_url }}')"></div>
  {% else %}
    <svg class="login-illustration" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 260 L220 120 L380 230 L600 70 L820 220 L1010 110 L1240 240 L1440 150 V420 H0 Z" fill="#c3cfdb" opacity=".7"/>
      <path d="M0 330 C 300 300, 600 320, 900 310 C 1150 300, 1300 310, 1440 300 V420 H0 Z" fill="#f4f7fa"/>
      <g fill="#3e7d5a"><path d="M90 340 L120 250 L108 254 L132 190 L156 254 L144 250 L174 340 Z"/><path d="M1260 335 L1292 235 L1279 240 L1305 170 L1331 240 L1318 235 L1350 335 Z"/></g>
      <g fill="#7a92aa"><path d="M170 345 L192 285 L184 288 L200 245 L216 288 L208 285 L230 345 Z"/><path d="M1200 340 L1222 280 L1214 283 L1230 240 L1246 283 L1238 280 L1260 340 Z"/></g>
    </svg>
  {% endif %}
  <canvas id="snow" aria-hidden="true"></canvas>
  <div>
    <div class="login-card">
      {% include "booking/_logo.html" with name=house_name %}
      <p class="sub">Календарь бронирований · Шерегеш</p>
      <form method="post" class="form">{% csrf_token %}
        {{ form.non_field_errors }}
        <p><label for="id_username">Логин</label>{{ form.username }}</p>
        <p><label for="id_password">Пароль</label>{{ form.password }}</p>
        <button class="btn primary" type="submit">Войти</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>
    <p class="login-foot">{{ house_name }}</p>
  </div>
</div>
<script src="{% static 'booking/login.js' %}" defer></script>
</body>
</html>
