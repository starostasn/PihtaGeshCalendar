services:
  web:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Фоновая синхронизация календарей площадок
  worker:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    command: python manage.py sync_loop
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS-сертификат Let's Encrypt выпускается и продлевается автоматически
  caddy:
    image: caddy:2.10-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
